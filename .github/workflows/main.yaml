name: Publish Helm Charts

on:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    name: Bump & Package Changed Charts
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install semantic-release locally
        run: |
          npm init -y
          npm install semantic-release semantic-release-helm3 \
            @semantic-release/commit-analyzer @semantic-release/release-notes-generator \
            @semantic-release/github
          npm install git+ssh://git@github.com/ryuunosukeds3/git-standards.git

      - name: Detect and process changed charts
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          for chart_dir in charts/*; do
            chart=$(basename "$chart_dir")

            # Find last chart tag
            last_tag=$(git tag -l "${chart}-*" --sort=-v:refname | head -n1)

            # Determine if chart changed since last tag
            if [ -n "$last_tag" ]; then
              changes=$(git diff --name-only "$last_tag"..HEAD "$chart_dir")
            else
              changes=1
            fi

            if [ -z "$changes" ]; then
              echo "No changes detected for $chart, skipping."
              continue
            fi

            echo "Processing chart: $chart"
            export CHART_PATH="charts/$chart"

            # Bump version with semantic-release using the release token
            npx semantic-release \
              --no-ci \
              --branches main \
              --extends ./.releaserc.js \
              --repository-url "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            # Read the new chart version
            new_version=$(yq '.version' "$CHART_PATH/Chart.yaml")
            echo "New version for $chart: $new_version"

            # Create per-chart Git tag
            git tag "${chart}-${new_version}"

            # Package chart
            helm package "$CHART_PATH"
          done

      - name: Push tags
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --tags

      - name: Upload Helm packages
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  publish:
    runs-on: ubuntu-latest
    needs: package
    name: Publish Helm Packages to gh-pages
    steps:
      - name: Checkout gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo

      - name: Download Helm packages
        uses: actions/download-artifact@v4
        with:
          name: package
          path: repo/

      - name: Update Helm repo index
        run: |
          cd repo
          helm repo index .

      - name: Commit and push
        run: |
          cd repo
          git add index.yaml *.tgz
          git commit -m "✏️ chore: Publish changed Helm charts ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
