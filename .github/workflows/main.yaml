name: Publish Helm Charts

on:
  push:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest
    name: Detect changed charts
    outputs:
      changed_charts: ${{ steps.set.outputs.changed_charts }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: set
        run: |
          CHANGED=$(git diff --name-only ${{ github.sha }}^ ${{ github.sha }} | grep '^charts/' | cut -d/ -f2 | sort -u)
          echo "changed_charts=$CHANGED" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs: detect
    name: Bump & Package Changed Charts
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install global dependencies
        run: |
          npm install -g git+ssh://git@github.com/ryuunosukeds3/git-standards.git
          npm install -g semantic-release semantic-release-helm3

      - name: Process changed charts
        run: |
          for chart in ${{ needs.detect.outputs.changed_charts }}; do
            echo "Processing chart: $chart"
            export CHART_PATH="charts/$chart"

            # Use semantic-release to bump version without tags or release notes
            semantic-release \
              --no-ci \
              --branches main \
              --extends ./.releaserc.js \
              --no-git-tag-version \
              --no-release-notes

            # Package chart
            helm package "$CHART_PATH"
          done

      - name: Upload Helm packages
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

  publish:
    runs-on: ubuntu-latest
    needs: package
    name: Publish Helm Packages to gh-pages
    steps:
      - name: Checkout gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo

      - name: Download Helm packages
        uses: actions/download-artifact@v4
        with:
          name: package
          path: repo/

      - name: Update Helm repo index
        run: |
          cd repo
          helm repo index .

      - name: Commit and push
        run: |
          cd repo
          git add index.yaml *.tgz
          git commit -m "✏️ chore: Publish changed Helm charts ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
