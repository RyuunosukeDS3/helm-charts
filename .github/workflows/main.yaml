name: Publish Helm Charts

on:
  push:
    branches:
      - main

jobs:
  bump-package-publish:
    runs-on: ubuntu-latest
    name: Bump, Package & Publish Changed Charts
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install global dependencies
        run: |
          npm install -g git+ssh://git@github.com/ryuunosukeds3/git-standards.git
          npm install -g semantic-release semantic-release-helm3

      - name: Detect and process changed charts
        run: |
          # Detect changed charts
          CHARTS=$(git diff --name-only ${{ github.sha }}^ ${{ github.sha }} \
                    | grep '^charts/' | cut -d/ -f2 | sort -u)

          if [ -z "$CHARTS" ]; then
            echo "No charts changed, skipping."
            exit 0
          fi

          for chart in $CHARTS; do
            echo "Processing chart: $chart"
            CHART_PATH="charts/$chart"

            # Bump version with semantic-release (no tags, no release notes)
            semantic-release \
              --no-ci \
              --branches main \
              --extends ./.releaserc.js \
              --no-git-tag-version \
              --no-release-notes

            # Package chart
            helm package "$CHART_PATH"
          done

      - name: Upload Helm packages
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

      - name: Publish Helm packages to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --single-branch --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} repo

          # Copy packages
          cp *.tgz repo/

          cd repo
          helm repo index .

          git add index.yaml *.tgz
          git commit -m "✏️ chore: Publish changed Helm charts ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
